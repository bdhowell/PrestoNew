        </div>
       </div>
      </div>
    </div>
    <div id="controls" aria-label="Poster controls">
        <div id="editor-controls">
            <button id="bold"><i class="fa-solid fa-bold"></i></button>
            <button id="italic"><i class="fa-solid fa-italic"></i></button>
            <button id="underline"><i class="fa-solid fa-underline"></i></button>
            <button id="strikethrough"><i class="fa-solid fa-strikethrough"></i></button>
            <button id="code" class="gap"><i class="fa-solid fa-code"></i></button>
            <button id="superscript"><i class="fa-solid fa-superscript"></i></button>
            <button id="subscript"><i class="fa-solid fa-subscript"></i></button>
            <button id="image" class="gap"><i class="fa-solid fa-image"></i></button>
            <button id="chart-line"><i class="fa-solid fa-chart-line"></i></button>
            <button id="square-root-variable"><i class="fa-solid fa-square-root-variable"></i></button>
        </div>
        <label for="poster-zoom">Zoom</label>
        <input id="poster-zoom" type="range" min="1" max="100" step="any" value="100"
               aria-label="Poster zoom percentage" aria-describedby="poster-zoom-value">
        <output id="poster-zoom-value" for="poster-zoom">100%</output>
    </div>
</body>
</html>
