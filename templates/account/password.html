{% extends "account/base.html" %}
{% block title %}Change password · {{ app_name() }}{% endblock %}
{% block content %}
    <section class="panel">
        <h1>Choose a new password</h1>
        <form class="account-form" method="post" action="/account/password" novalidate>
            {% if not recovering %}
            <label>Current password
                <input name="current_password" type="password" autocomplete="current-password" required>
                <small class="field-error" data-for="current_password"></small>
            </label>
            {% endif %}
            <label>New password
                <input name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="256">
                <small class="field-error" data-for="password"></small>
            </label>
            <p class="form-message" role="status"></p>
            <button type="submit">Change password</button>
        </form>
    </section>
{% endblock %}
