<form class="account-form" method="post" action="/account/recover" data-done="hide" novalidate>
    <label>Email
        <input name="email" type="email" autocomplete="email" required maxlength="254" value="{{ email | default('') }}">
        <small class="field-error" data-for="email"></small>
    </label>
    <p class="form-message" role="status"></p>
    <button type="submit">Send recovery link</button>
</form>
