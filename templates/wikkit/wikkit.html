<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wikkit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Aladin&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/router.css">
    <script src="/static/javascript/wikkit.js" defer></script>
    {% include "page_assets.html" %}
</head>
<body class="wikkit">
    {% include "menu.html" %}
    <iframe id="wikkit-frame" title="Wikkit page" data-src="{{ url }}"></iframe>
    <section id="chatbot" aria-label="Wikkit chatbot" data-socket="{{ socket_path }}"
             style="--chat-window-transition: {{ chat_window_transition_ms }}ms; --chat-input-transition: {{ chat_input_transition_ms }}ms">
        <header class="chatbot-handle">Wikkit</header>
        <div id="chatlog" role="log" aria-live="polite"></div>
        <div id="chatinput" contenteditable="plaintext-only" role="textbox"
             aria-label="Message Wikkit" aria-multiline="true"></div>
    </section>
</body>
</html>
