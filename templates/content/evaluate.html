{% extends "page.html" %}
{% block title %}Evaluating graphics - {{ app_name() }}{% endblock %}
{% block scripts %}{% include "mathjax.html" %}{% endblock %}
{% block styles %}<link rel="stylesheet" href="/static/css/pages/content-evaluate.css">{% endblock %}
{% block content %}
<h1>Evaluating your graphics</h1>
<p class="centered-text">
    <img src="/static/graphics/wikkitmeasuring.png" alt="Wikkit measuring a graphic"
         width="400" height="300">
</p>
<p id="evaluation-status" role="status" aria-live="polite">Preparing to evaluate your graphics.</p>
<div id="evaluation-progress" hidden>
    <progress id="evaluation-progress-meter" value="0" max="1" aria-label="Graphics evaluated"></progress>
    <span id="evaluation-remaining"></span>
</div>
<article id="graphic-evaluations" class="graphic-evaluation" tabindex="0" aria-label="Latest graphic evaluation" hidden>
    <div id="evaluation-summary" class="evaluation-metrics" aria-label="Graphic evaluation summary"></div>
    <div id="evaluation-panes">
        <div id="evaluation-preview" aria-label="Most recently evaluated graphic"></div>
        <div id="evaluation-divider" role="separator" tabindex="0" aria-orientation="horizontal"
             aria-label="Resize graphic and details" aria-controls="evaluation-preview evaluation-details"
             aria-valuemin="20" aria-valuemax="80" aria-valuenow="50"
             title="Drag or use arrow keys to resize the graphic and details"></div>
        <div id="evaluation-details" aria-label="Graphic evaluation details"></div>
    </div>
</article>
<button id="retry-evaluation" type="button" hidden>Try again</button>
<p class="evaluation-actions"><button id="continue-review" type="button" data-sends="ok" hidden>Continue to Poster</button></p>
<script id="evaluation-poster" type="application/json">{{ {"pid": pid} | tojson }}</script>
{% endblock %}
