<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ poster.name }} - {{ app_name() }}</title>
    <link rel="stylesheet" href="/static/css/main.css">
    {% include "page_assets.html" %}
</head>
<body class="wikkit-page">
<main>
<nav class="viewer-controls" aria-label="Poster viewer">
    <a href="/posters/list" data-close-viewer>Close</a>
    <button type="button" data-fit>Fit to viewport</button>
    <label>Zoom <input type="range" min="1" max="100" value="100" aria-label="Poster zoom percentage"></label>
    <button type="button" data-full-size>Full size (100%)</button>
    <output aria-live="polite"></output>
</nav>
<p class="viewer-message" role="status"></p>
<div class="poster-viewport" tabindex="0" aria-label="Scrollable poster">
    <div class="poster-canvas">
        <iframe src="/posters/{{ poster.pid }}/preview" title="{{ poster.name }}"></iframe>
    </div>
</div>
</main>
</body>
</html>
